# Model specs for the patching pipeline (interp/spec.py). All specs share one base model and
# are switched by activating LoRA adapters, never by reloading weights.
base_model: Qwen/Qwen3.5-9B

adapters:
  sft: Stereotypes-in-LLMs/qwen3.5-9b-hiring-debias-sft-en
  # Delivered by the DPO team; pass --adapter dpo=PATH or export HBM_DPO_ADAPTER.
  dpo: ${HBM_DPO_ADAPTER}
  # The 9B-en reference arm (docs/EVAL_STANDARD.md) and decision distillation on top of it
  # (docs/DECISION_DISTILL.md); the distillation LoRA was trained on SFT-v3 merged, so its spec
  # stacks the two adapters, as `dpo` does.
  sft_v3: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
  distill42: outputs/distill/decision_distill_seed42
  distill43: outputs/distill/decision_distill_seed43

specs:
  base: {adapters: []}
  sft: {adapters: [sft]}
  # Assumes the DPO LoRA was trained on top of the SFT model (merged SFT + new adapter), which
  # equals stacking the two adapters. If the DPO run instead continued training the SFT
  # adapter itself, change this to `adapters: [dpo]`. Confirm with the DPO team before S11.
  dpo: {adapters: [sft, dpo], reference: sft}
  sft_v3: {adapters: [sft_v3]}
  distill42: {adapters: [sft_v3, distill42], reference: sft_v3}
  distill43: {adapters: [sft_v3, distill43], reference: sft_v3}
