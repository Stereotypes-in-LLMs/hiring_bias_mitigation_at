# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# On-policy v2 negatives over v1's whole English pool (35,826 rows over 3,000 pairs): the SFT
# student's own covert, attribute-tipped mistakes as `rejected`, v1's teacher text as `chosen`.
# The method was validated on batch-01 (batch-01-onpolicy: D3 0.574 vs the teacher's 0.883,
# D4 50% vs 81%); this run is for size. Run through scripts/cscs/onpolicy_full.sbatch.
source_artifacts_dir: artifacts/semisynthetic-v1
artifacts_dir: artifacts/semisynthetic-v2/onpolicy-full
lang: en
seed: 42
val_fraction: 0.05

student_base: Qwen/Qwen3.5-9B
student_adapter: Stereotypes-in-LLMs/qwen3.5-9b-hiring-debias-sft-en
samples_per_prompt: 8
min_free_right: 0.5
# 512 prompts x 8 samples is about a minute and a half per GPU: the most a job cut by the
# time limit can lose.
chunk_size: 512
student_vllm:
  gpu_memory_utilization: 0.70      # of 95.6 GiB usable; anything near 96 GB OOMs
  max_model_len: 8192
  max_num_seqs: 256                 # 32 prompts x 8 samples in flight; batch-01 used 64
  engine_kwargs:
    gdn_prefill_backend: triton     # no CUDA toolkit on Daint for FlashInfer's JIT
student_generation:
  max_new_tokens: 200
  temperature: 1.0
  top_p: 1.0
  seed: 42

judge_strategies:
- student_tipped
max_length_delta_words: 10
min_plausibility: 3
n_samples: 20

# The teacher, as judge only -- the same settings as batch-01.
teacher_model: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
backend: vllm
dtype: auto
max_model_len: 8192
tensor_parallel_size: 4
gpu_memory_utilization: 0.80
max_num_seqs: 128
engine_kwargs:
  gdn_prefill_backend: triton
judge_generation:
  max_new_tokens: 160
  temperature: 0.0
  top_p: 1.0
