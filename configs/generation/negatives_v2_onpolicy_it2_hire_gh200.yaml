# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# Hire-side top-up of onpolicy-it2, as onpolicy-hire32 was of onpolicy-full: pi1 (r2em
# checkpoint-100) samples the 5,072 hire rows again at k=32, both prompts. Its split follows
# onpolicy-it2's rows and its balance stage merges onpolicy-it2's pairs first; the DPO data
# config en_only_v2_it2 reads its balanced/.
#   CONFIG=configs/generation/negatives_v2_onpolicy_it2_hire_gh200.yaml \
#     scripts/cscs/submit.sh -p debug -t 00:30:00 -J xw-it2-hire scripts/cscs/onpolicy_full.sbatch sample
source_artifacts_dir: artifacts/semisynthetic-v1
artifacts_dir: artifacts/semisynthetic-v2/onpolicy-it2-hire32
topup_of: artifacts/semisynthetic-v2/onpolicy-it2
row_filter:
  reference_decision: hire
lang: en
seed: 42
val_fraction: 0.05

student_base: Qwen/Qwen3.5-9B
student_adapter: outputs/dpo/qwen3.5-9b_en_only_dpo_v2neg_r2em/checkpoint-100
samples_per_prompt: 32
min_free_right: 0.5
# 128 prompts x 32 samples: the same samples per chunk as the full run's 512 x 8.
chunk_size: 128
student_vllm:
  gpu_memory_utilization: 0.70      # of 95.6 GiB usable; anything near 96 GB OOMs
  max_model_len: 8192
  max_num_seqs: 256                 # 8 prompts x 32 samples in flight
  engine_kwargs:
    gdn_prefill_backend: triton     # no CUDA toolkit on Daint for FlashInfer's JIT
student_generation:
  max_new_tokens: 200
  temperature: 1.0
  top_p: 1.0
  seed: 42

judge_strategies:
- student_tipped
max_length_delta_words: 10
min_plausibility: 3
n_samples: 20

# The teacher, as judge only -- the same settings as batch-01.
teacher_model: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
backend: vllm
dtype: auto
max_model_len: 8192
tensor_parallel_size: 4
gpu_memory_utilization: 0.80
max_num_seqs: 128
engine_kwargs:
  gdn_prefill_backend: triton
judge_generation:
  max_new_tokens: 160
  temperature: 0.0
  top_p: 1.0
