# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# The first small batch of v2 negatives: 240 of v1's English prompts (20 per protected group x
# condition x reference decision, one row per pair), each given three candidate `rejected`
# responses by the teacher, judged, filtered and written for the preference-direction check.
# Design and acceptance criteria: docs/superpowers/specs/2026-10-13-dpo-negatives-v2-design.md
#
#   python scripts/generate_negatives_v2.py --config configs/generation/negatives_v2_small.yaml --dry-run
#   python scripts/generate_negatives_v2.py --config configs/generation/negatives_v2_small.yaml
#   python scripts/check_preference_direction.py --batch artifacts/semisynthetic-v2/batch-01 \
#       --student Stereotypes-in-LLMs/qwen3.5-9b-hiring-debias-sft-en
#
# Teacher settings are copied from configs/generation/teacher.yaml. gpu_memory_utilization was
# tuned for the DGX Spark's 128 GB unified memory; on a 96 GB GH200 the Int4 weights (~71 GiB)
# need ~0.9 and a smaller max_num_seqs.
teacher_model: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
backend: vllm
dtype: auto
max_model_len: 8192
gpu_memory_utilization: 0.68
max_num_seqs: 64

# v1 inputs: the raw invariant pass is the prompt side plus the chosen side (re-filtered with
# v1's own filter). Read from the drive, or fetched from the public dataset with --from-hub.
source_artifacts_dir: artifacts/semisynthetic-v1
source_hub_repo: Stereotypes-in-LLMs/hiring-bias-mitigation-synthetic-data
lang: en

artifacts_dir: artifacts/semisynthetic-v2/batch-01

# 20 x (3 groups x 2 conditions x 2 reference decisions) = 240 prompts, one per pair.
rows_per_cell: 20
strategies:
- covert_flip
- minimal_edit
- proxy_cue

# Filters. Length is matched to the chosen rationale; the judge threshold is on a 1-5 scale.
max_length_delta_words: 10
min_plausibility: 3

# Split: v1's candidate-level rule, plus every candidate v1 already held out.
val_fraction: 0.05
seed: 42
n_samples: 20

# Negatives run at v1's warm settings so rationales vary; the judge runs greedily.
generation:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  seed: 42
judge_generation:
  max_new_tokens: 160
  temperature: 0.0
  top_p: 1.0
