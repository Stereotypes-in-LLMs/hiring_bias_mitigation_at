# Registered poster follow-up, 2026-11-02. Final adapter; no checkpoint selection.
# Uniform rank 163 on layers 15-20: 58,085,376 parameters, 0.1900% below
# all-layer r32's 58,195,968. alpha/r stays 2; all other settings follow the
# same-seed full-layer one-epoch distillation. This controls parameter budget
# approximately; it does not control per-layer rank or optimization geometry.
# See docs/POSTER_FOLLOWUP_EXPERIMENTS.md. Submit through train_window_budget.sbatch.
stage: decision_distill
objective: decision_distill
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_distill_v3_all.yaml
output_dir: outputs/distill/decision_distill_l15_20_r163_seed43
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 163
lora_alpha: 326
lora_dropout: 0.0
lora_layer_range: [15, 20]
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
# One prompt per device and micro-step (no padding): 4 GPUs x 8 accumulation = 32 rows a step,
# 10,907 rows = 341 optimizer steps in one epoch (reports/cost/steps.csv).
num_train_epochs: 1
max_steps: -1
learning_rate: 3.0e-05
lr_scheduler_type: warmup_stable_decay   # GRPO-improve's default: decay over the last 26%
lr_scheduler_kwargs:
  num_decay_steps: 89
  decay_type: linear
warmup_steps: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
ddp_find_unused_parameters: false
weight_decay: 0.0
dtype: bfloat16
seed: 43
logging_steps: 5
save_steps: 50
save_total_limit: 10
memory_floor_gb: 12
resume: true
wandb_project: hiring-bias-mitigation
wandb_run_name: distill-decision_distill_l15_20_r163_seed43
