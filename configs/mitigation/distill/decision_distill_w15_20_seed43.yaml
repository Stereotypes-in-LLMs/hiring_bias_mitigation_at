# Hand-written -- NOT produced by generate_experiment_configs.py.
#
# Whole-window patching-informed decision distillation, seed 43 (docs/PATCHING_DISTILL.md, 1C):
# decision_distill_l15_20_seed43 with the GDN projections of layers 15-20 added to the LoRA
# targets. Everything else is identical.
# The audited checkpoint is the final adapter, declared before training.
#   HBM_COST_ARM=patching_distill REPO=$PWD CONFIG=configs/mitigation/distill/decision_distill_w15_20_seed43.yaml \
#     scripts/cscs/submit.sh -p normal -t 02:00:00 scripts/cscs/train_distill.sbatch
stage: decision_distill
objective: decision_distill
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_distill_v3_all.yaml
output_dir: outputs/distill/decision_distill_w15_20_seed43
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_layer_range: [15, 20]          # decoder layers 15-20, inclusive: Marta's pathway window
# Every large projection in the window, the GDN (linear-attention) mixers of layers 16-18 and 20
# included: 38 modules, 15,073,280 trainable parameters (docs/PATCHING_DISTILL.md, 1C).
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj,
                      in_proj_qkv, in_proj_z, out_proj]
# One prompt per device and micro-step (no padding): 4 GPUs x 8 accumulation = 32 rows a step,
# 10,907 rows = 341 optimizer steps in one epoch (reports/cost/steps.csv).
num_train_epochs: 1
max_steps: -1
learning_rate: 3.0e-05
lr_scheduler_type: warmup_stable_decay   # GRPO-improve's default: decay over the last 26%
lr_scheduler_kwargs:
  num_decay_steps: 89
  decay_type: linear
warmup_steps: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
ddp_find_unused_parameters: false
weight_decay: 0.0
dtype: bfloat16
seed: 43
logging_steps: 5
save_steps: 50
save_total_limit: 10
memory_floor_gb: 12
resume: true
wandb_project: hiring-bias-mitigation
wandb_run_name: distill-decision_distill_w15_20_seed43
