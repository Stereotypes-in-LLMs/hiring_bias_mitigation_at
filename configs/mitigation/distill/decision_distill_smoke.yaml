# Hand-written -- NOT produced by generate_experiment_configs.py.
#
# Counterfactual decision distillation -- six-step smoke, not a result (docs/DECISION_DISTILL.md): SFT-v3 plus a fresh LoRA,
# trained so that its decision on an attributed CV matches SFT-v3's (the LoRA disabled) on the
# same pair's attribute-free CV, KL over the hire/reject tokens after the decision prefix
# (mitigation/decision_distill.py). The audited checkpoint is the final adapter.
#   HBM_COST_ARM=decision_distill REPO=$PWD CONFIG=configs/mitigation/distill/decision_distill_smoke.yaml \
#     scripts/cscs/submit.sh -p debug -t 00:30:00 scripts/cscs/train_distill.sbatch
stage: decision_distill
objective: decision_distill
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_distill_v3_all.yaml
output_dir: outputs/distill/decision_distill_smoke
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
# One prompt per device and micro-step (no padding): 4 GPUs x 8 accumulation = 32 rows a step,
# 10,907 rows = 340 steps in one epoch.
num_train_epochs: 1
max_steps: 6
learning_rate: 3.0e-05
lr_scheduler_type: warmup_stable_decay   # GRPO-improve's default: decay over the last 26%
lr_scheduler_kwargs:
  num_decay_steps: 2
  decay_type: linear
warmup_steps: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
ddp_find_unused_parameters: false
weight_decay: 0.0
dtype: bfloat16
seed: 42
logging_steps: 5
save_steps: 50
save_total_limit: 10
memory_floor_gb: 12
resume: true
wandb_project: hiring-bias-mitigation
wandb_run_name: distill-decision_distill_smoke
