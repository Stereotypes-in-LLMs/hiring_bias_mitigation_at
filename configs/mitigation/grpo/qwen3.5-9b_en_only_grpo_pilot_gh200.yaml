# Hand-written -- NOT produced by generate_experiment_configs.py.
#
# GRPO pilot from the published SFT adapter (mitigation/grpo.py). One GH200 node, four GPUs,
# each with its own colocated vLLM engine. 3,000 prompts x 8 completions, 16 prompts per
# optimizer step: 187 steps. Resumable: the same submission again continues from the newest
# checkpoint (every 25 steps).
#   CONFIG=configs/mitigation/grpo/qwen3.5-9b_en_only_grpo_pilot_gh200.yaml \
#     scripts/cscs/submit.sh -p normal -t 06:00:00 scripts/cscs/train_grpo.sbatch
stage: grpo
objective: grpo
data_kind: grpo
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: Stereotypes-in-LLMs/qwen3.5-9b-hiring-debias-sft-en
data_config: configs/data/en_only_grpo_02.yaml
output_dir: outputs/grpo/qwen3.5-9b_en_only_grpo_pilot
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0              # dropout makes the policy's log-probs noisy against vLLM's
disable_dropout: true
# GRPO
beta: 0.04                     # KL to SFT (the adapter disabled)
num_generations: 8
temperature: 1.0
top_p: 1.0
max_completion_length: 96      # SFT answers are ~40 tokens of JSON
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.30   # of 95.6 GiB; the policy and its optimizer take ~30 GB
vllm_max_model_length: 4096         # longest prompt ~2.5k tokens, plus 96
vllm_engine_kwargs:
  gdn_prefill_backend: triton       # no CUDA toolkit on Daint for FlashInfer's JIT
  # Text prompts only: no vision-encoder profiling at start-up, where job 5065963 died
  # (CUDA illegal memory access in profile_encoder_cache on rank 0, before any training).
  language_model_only: true
log_completions: false
# Optimisation: 8 completions per GPU per micro-step x 4 GPUs x 4 accumulation = 128
# completions = 16 prompts per step.
num_train_epochs: 1
max_steps: -1
learning_rate: 1.0e-05
lr_scheduler_type: constant_with_warmup
warmup_steps: 5
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
gradient_checkpointing: true
weight_decay: 0.0
dtype: bfloat16
seed: 42
logging_steps: 1
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: grpo-qwen3.5-9b_en_only_grpo_pilot
# Is vLLM serving the policy? HF + PEFT margins against vLLM's on 256 held-out prompts when a
# segment starts and every 50 steps (mitigation/grpo.py, SyncValidationCallback).
sync_validate_rows: 256
sync_validate_steps: 50
# Greedy decisions on 256 held-out prompts every 25 steps; stop when the projected benchmark
# hire rate leaves 20-40% (round-1 DPO went to 19%). Projection: each reference side's hire
# rate relative to SFT's on the same rows, times SFT's benchmark rate on that side
# (mitigation/grpo.py, projected_hire_rate).
decision_eval_rows: 256
decision_eval_steps: 25
hire_rate_band: [0.20, 0.40]
resume: true
save_steps: 25
save_total_limit: 20
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
