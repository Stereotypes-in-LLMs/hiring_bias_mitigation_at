# Hand-written -- NOT produced by generate_experiment_configs.py.
# Acceleration benchmark B3 (docs/ACCEL_BENCH.md, scripts/cscs/bench_grpo_rollout.sbatch): six
# optimizer steps of GRPO + lr decay R4 (r4_tipped.yaml), 256 completions a step, with the
# rollouts generated by transformers' generate (use_vllm: false), the no-vLLM path.
# The two bench_rollout_*.yaml differ only in the generation path and output_dir. The monitors
# that generate outside the step are off in both; nothing trained here is audited or kept.
stage: grpo
objective: grpo
data_kind: grpo
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_grpo_v3_all_tipped.yaml
output_dir: outputs/bench/grpo_rollout_hf
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0              # dropout makes the policy's log-probs noisy against vLLM's
disable_dropout: true
beta: 0.04                     # KL to SFT-v3 (the adapter disabled)
num_generations: 16
temperature: 1.0
top_p: 1.0
max_completion_length: 96      # SFT answers are ~40 tokens of JSON
use_vllm: false
benchmark_generation: transformers
log_completions: false
num_train_epochs: 1
max_steps: 6
learning_rate: 3.0e-05
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 1
  decay_type: linear
warmup_steps: 1
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
gradient_checkpointing: true
weight_decay: 0.0
dtype: bfloat16
seed: 42
logging_steps: 1
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: bench-grpo-rollout-hf
use_wandb: false
benchmark_only: true
resume: false
save_steps: 1000
save_total_limit: 20
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
